<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stechoq Hardware Simulation</title>
    <!-- Roboto: the handheld app is an Android app, and looks like one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="Virtual hardware laboratory for testing industrial device integrations without physical hardware."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23103a6b'/%3E%3Cpath d='M8 20h4l3-8 3 12 3-8h3' stroke='%2358d6a8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so users who chose dark never
      // see a white flash. Default is light; the app re-applies on boot.
      try {
        var s = JSON.parse(localStorage.getItem('shs.settings') || '{}');
        document.documentElement.dataset.theme = s.theme === 'dark' ? 'dark' : 'light';
        if (s.lang === 'id' || s.lang === 'en') document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
