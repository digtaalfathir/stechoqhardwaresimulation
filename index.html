<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stechoq Hardware Simulation</title>
    <meta
      name="description"
      content="Virtual hardware laboratory for testing industrial device integrations without physical hardware."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23103a6b'/%3E%3Cpath d='M8 20h4l3-8 3 12 3-8h3' stroke='%2358d6a8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so dark users never see a
      // white flash. The app re-applies the same value once it boots.
      try {
        var s = JSON.parse(localStorage.getItem('shs.settings') || '{}');
        document.documentElement.dataset.theme =
          s.theme === 'dark' || s.theme === 'light'
            ? s.theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        if (s.lang === 'id' || s.lang === 'en') document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
